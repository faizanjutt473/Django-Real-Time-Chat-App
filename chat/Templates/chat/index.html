<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Chat Rooms</title>
</head>
<body>
    <p>
        Logged in as <strong>{{ request.user.username }}</strong>
    </p>
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>
    <h2>Enter a room name</h2>
    <input id="room-name-input" type="text" size="30" placeholder="e.g. lobby"><br><br>
    <button id="room-name-submit">Enter Room</button>

    <script>
        const input = document.querySelector('#room-name-input');
        const button = document.querySelector('#room-name-submit');

        input.focus();
        input.onkeyup = function (e) {
            if (e.key === 'Enter') button.click();
        };

        button.onclick = function () {
            const roomName = input.value.trim();
            if (roomName) {
                window.location.pathname = '/chat/' + roomName + '/';
            }
        };
    </script>
</body>
</html>
